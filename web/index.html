<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fdfbf7">
  <title>无限贴纸 · 留下每一步</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M19 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6M15 3l6 6M9 15l1-5L18 2l4 4-8 8-5 1Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5M3 3l6 6m12-6-6 6M3 21l6-6m12 6-6-6"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="m16 3 5 5-3 1-3 6-3-3-7 7m2-12 6-3 1-3M6 8l10 10"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 6-6 5 5 3-3 4 4"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 6-6 6 6 6m8-12 6 6-6 6M14 3l-4 18"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V3H3v13h5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3m-5 5 5-5 5 5M4 16v5h16v-5"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="m9 15 6-6m-5-3 3-3a5 5 0 0 1 7 7l-3 3m-3 5-3 3a5 5 0 0 1-7-7l3-3"/></symbol>
  </svg>

  <section id="login-screen" class="login-screen">
    <div class="login-decoration" aria-hidden="true"><span>每一个片刻</span><span>都有它的位置。</span></div>
    <form id="login-form" class="login-card">
      <div class="brand-mark"><svg class="icon"><use href="#i-note"/></svg></div>
      <h1>无限贴纸</h1><p class="muted">留下每一步，回看自己的时间。</p>
      <label for="password">个人空间密码</label>
      <input id="password" type="password" autocomplete="current-password" required placeholder="输入登录密码" maxlength="1024">
      <p id="login-error" class="error-message" role="alert"></p>
      <button class="primary" type="submit">进入我的画布 <svg class="icon"><use href="#i-arrow"/></svg></button>
      <span class="login-footnote">你的记录，仅自己可见</span>
    </form>
  </section>

  <div id="app" class="app" hidden>
    <button id="sidebar-shade" class="sidebar-shade" aria-label="关闭主题菜单" hidden></button>
    <aside id="sidebar" class="sidebar">
      <div class="brand"><div class="brand-mark"><svg class="icon"><use href="#i-note"/></svg></div><div><h1>无限贴纸</h1><p>留下每一步</p></div></div>
      <div class="section-label">主题画布 <span id="topic-count"></span></div>
      <nav id="topics" aria-label="主题列表"></nav>
      <button id="new-topic" class="new-topic"><svg class="icon"><use href="#i-plus"/></svg> 新建主题</button>
      <div class="sidebar-bottom">
        <button id="trash-button" class="nav-button"><svg class="icon"><use href="#i-trash"/></svg> 回收站 <span id="trash-count"></span></button>
        <div class="backup-actions"><button id="export-button"><svg class="icon"><use href="#i-download"/></svg>导出备份</button><button id="import-button"><svg class="icon"><use href="#i-upload"/></svg>恢复备份</button></div>
        <div class="account"><span class="avatar">我</span><div><strong>我的个人空间</strong><span>只属于你的时间线</span></div><button id="logout-button" title="退出登录" aria-label="退出登录">↗</button></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="heading"><button id="menu-button" class="icon-button" aria-label="打开主题菜单"><svg class="icon"><use href="#i-menu"/></svg></button><div><div class="eyebrow">MY TIMELINE</div><h2 id="topic-title">我的画布</h2><p id="topic-subtitle">让零散的片刻，慢慢连成一条线。</p></div></div>
        <div class="top-actions"><button id="save-status" class="save-status" title="点击重试未保存内容" aria-live="polite"><span class="status-dot"></span><span id="save-text">已保存</span></button><button id="fit-button" class="secondary"><svg class="icon"><use href="#i-fit"/></svg><span>查看全部</span></button><button id="new-record" class="primary"><svg class="icon"><use href="#i-plus"/></svg><span>新增便签</span></button></div>
      </header>
      <section id="viewport" class="viewport" aria-label="可拖动和缩放的时间画布">
        <div id="world" class="world"><svg id="lines" class="lines" xmlns="http://www.w3.org/2000/svg"><path id="timeline-base"/><path id="timeline-dash"/><g id="connectors"></g><g id="nodes"></g></svg><div id="notes"></div></div>
        <div id="empty-state" class="empty-state" hidden><div class="empty-art">✧</div><h3>从一张便签开始</h3><p>一句想法，一张截图，或者今天的小进展。</p><button id="empty-add" class="primary">留下第一条记录 <svg class="icon"><use href="#i-plus"/></svg></button></div>
        <div class="canvas-caption"><span class="caption-line"></span> 时间在这里，慢慢留下痕迹</div>
        <div class="zoom-controls"><button id="zoom-out" aria-label="缩小">−</button><span id="zoom-level">100%</span><button id="zoom-in" aria-label="放大">＋</button><span class="control-divider"></span><button id="zoom-fit" title="查看全部" aria-label="查看全部"><svg class="icon"><use href="#i-fit"/></svg></button></div>
        <div class="canvas-help">滚轮缩放 · 拖动空白处 / 按住中键移动</div>
      </section>
      <section id="trash-view" class="trash-view" hidden><p class="muted">删除的便签会留在这里，恢复后按原时间回到所属主题。</p><div id="trash-list"></div></section>
    </main>
  </div>

  <dialog id="form-dialog" class="form-dialog"><form id="dialog-form"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="dialog-close" class="icon-button" aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button></div><p id="dialog-description" class="muted"></p><div id="dialog-fields"></div><p id="dialog-error" class="error-message" role="alert"></p><div class="dialog-actions"><button type="button" id="dialog-cancel" class="secondary">取消</button><button type="submit" id="dialog-submit" class="primary">确认</button></div></form></dialog>
  <dialog id="mobile-reader" class="mobile-reader"><div class="mobile-reader-head"><span id="mobile-time"></span><button id="mobile-close" class="icon-button" aria-label="关闭阅读"><svg class="icon"><use href="#i-close"/></svg></button></div><h2 id="mobile-title"></h2><div id="mobile-body" class="rich-content"></div></dialog>
  <dialog id="image-viewer" class="image-viewer"><div class="viewer-bar"><span id="image-counter"></span><div><button id="image-smaller" aria-label="缩小图片">−</button><button id="image-larger" aria-label="放大图片">＋</button><button id="image-reset">适应屏幕</button><button id="image-close" aria-label="关闭图片"><svg class="icon"><use href="#i-close"/></svg></button></div></div><div id="image-stage"><img id="viewer-image" alt="记录中的图片" draggable="false"></div><button id="image-prev" class="viewer-prev" aria-label="上一张图片">‹</button><button id="image-next" class="viewer-next" aria-label="下一张图片">›</button></dialog>
  <input id="image-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
  <input id="backup-input" type="file" accept=".zip,application/zip" hidden>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
